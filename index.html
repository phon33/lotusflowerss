<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Wither Practice Tool</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fbe8ee 0%, #e6d3ed 50%, #d8c3e8 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --purple-primary: #7d3c98;
      --purple-hover: #6c3483;
      --text-dark: #332233;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-dark);
    }

    .game-container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12), 0 5px 15px rgba(125, 60, 152, 0.08);
      padding: 25px 35px;
      max-width: 900px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    h1 {
      font-size: 26px;
      color: var(--purple-primary);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #665566;
      margin-bottom: 20px;
    }

    /* Bouquets Banner Window */
    .bouquet-stage {
      background: linear-gradient(180deg, #fce4ec 0%, #f3e5f5 100%);
      border: 6px solid #ffffff;
      outline: 2px solid #e1bee7;
      border-radius: 18px;
      padding: 25px 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 15px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .bouquet-card {
      position: relative;
      width: 30%;
      max-width: 250px;
      aspect-ratio: 1.15;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
      transition: transform 0.2s ease;
    }

    .bouquet-card:hover {
      transform: translateY(-2px);
    }

    .bouquet-svg {
      width: 100%;
      height: 100%;
    }

    /* Form & Input */
    .input-form {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      padding: 12px 20px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      border: 2px solid #d8b4e2;
      border-radius: 12px;
      outline: none;
      width: 240px;
      text-transform: uppercase;
      text-align: center;
      background: #ffffff;
      color: var(--purple-primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--purple-primary);
      box-shadow: 0 0 0 4px rgba(125, 60, 152, 0.15);
    }

    button.btn-primary {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      background-color: var(--purple-primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(125, 60, 152, 0.25);
      transition: background 0.2s, transform 0.1s;
    }

    button.btn-primary:hover {
      background-color: var(--purple-hover);
    }

    button.btn-primary:active {
      transform: scale(0.98);
    }

    /* Feedback Line */
    .feedback {
      min-height: 32px;
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .feedback.correct {
      color: #27ae60;
    }

    .feedback.wrong {
      color: #e74c3c;
    }

    .time-badge {
      background: #e8f8f5;
      color: #117a65;
      border: 1px solid #a3e4d7;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 14px;
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      background: #f8f0fc;
      padding: 12px 20px;
      border-radius: 14px;
      border: 1px solid #ebdaf2;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: 600;
      color: #553355;
    }

    .stat-item span {
      color: var(--purple-primary);
      font-weight: 800;
    }

    /* Controls */
    .control-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn-secondary {
      background: #ffffff;
      border: 1px solid #d8b4e2;
      color: var(--purple-primary);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: #f8f0fc;
      border-color: var(--purple-primary);
    }

    /* Color Bank */
    .color-bank {
      background: #ffffff;
      border: 1px solid #e1bee7;
      border-radius: 14px;
      padding: 12px;
      transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
      overflow: hidden;
    }

    .color-bank.hidden {
      max-height: 0;
      opacity: 0;
      padding: 0 12px;
      border: none;
    }

    .color-bank-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #887788;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .flower-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .flower-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #fcf8ff;
      border: 1px solid #f0e0f5;
      font-size: 12px;
      font-weight: 700;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 2px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>Wither Practice</h1>
    <p class="subtitle">Identify the missing flower (neither in text nor in color)! First to 5 wins.</p>

    <!-- 3 Horizontal Bouquets -->
    <div class="bouquet-stage" id="bouquetStage">
      <!-- Generated via JavaScript -->
    </div>

    <!-- Input Form -->
    <form class="input-form" id="guessForm" onsubmit="handleGuess(event)">
      <input type="text" id="guessInput" placeholder="TYPE FLOWER..." autocomplete="off" autofocus />
      <button type="submit" class="btn-primary">Submit</button>
    </form>

    <!-- Feedback Area -->
    <div class="feedback" id="feedback"></div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item">Score: <span id="score">0</span> / 5</div>
      <div class="stat-item">Last Time: <span id="lastTime">--</span></div>
      <div class="stat-item">Best Time: <span id="bestTime">--</span></div>
    </div>

    <!-- Extra Controls -->
    <div class="control-row">
      <button class="btn-secondary" id="toggleBankBtn" onclick="toggleColorBank()">Hide Color Bank</button>
    </div>

    <!-- Color Bank Reference -->
    <div class="color-bank" id="colorBank">
      <div class="color-bank-title">Flower Color Reference</div>
      <div class="flower-pills" id="flowerPills"></div>
    </div>
  </div>

  <script>
    const FLOWERS = [
      { name: "LOTUS",   color: "#F3A2B5", displayColor: "Pink" },
      { name: "IRIS",    color: "#1E62FF", displayColor: "Blue" },
      { name: "COSMOS",  color: "#5E2B78", displayColor: "Purple" },
      { name: "ROSE",    color: "#9E0B2B", displayColor: "Red" },
      { name: "TULIP",   color: "#E5C800", displayColor: "Yellow" },
      { name: "POPPY",   color: "#C65100", displayColor: "Orange" },
      { name: "JASMINE", color: "#007B4B", displayColor: "Green" }
    ];

    let currentMissing = "";
    let score = 0;
    let roundStartTime = 0;
    let bestTime = null;

    function createBouquetSVG(wordText, colorHex) {
      return `
        <svg class="bouquet-svg" viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="spray-${wordText}" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" result="noise"/>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
          </defs>
          <g transform="translate(120, 95)">
            <!-- Outer Wrapping -->
            <path d="M -70,-20 Q -95,-60 -65,-75 Q 0,-85 65,-75 Q 95,-60 70,-20 L 35,45 Q 0,60 -35,45 Z" fill="#fde8f0" stroke="#f8bbd0" stroke-width="2"/>
            <path d="M -60,-20 Q -80,-55 -55,-68 Q 0,-75 55,-68 Q 80,-55 60,-20 L 30,40 Q 0,52 -30,40 Z" fill="#fff0f5"/>
            <!-- Foliage & Flowers -->
            <path d="M -50,-65 C -65,-85 -35,-95 -25,-75 C -10,-95 10,-95 25,-75 C 35,-95 65,-85 50,-65 Z" fill="#2e7d32"/>
            <circle cx="-35" cy="-70" r="14" fill="#ab47bc"/><circle cx="-35" cy="-70" r="5" fill="#fbc02d"/>
            <circle cx="0" cy="-75" r="16" fill="#f48fb1"/><circle cx="0" cy="-75" r="6" fill="#fff59d"/>
            <circle cx="35" cy="-70" r="14" fill="#42a5f5"/><circle cx="35" cy="-70" r="5" fill="#fbc02d"/>
            <!-- Banner Ribbon -->
            <path d="M -85,-15 Q 0,-30 85,-15 Q 90,15 85,20 Q 0,5 -85,20 Q -90,15 -85,-15 Z" fill="#fffdfa" stroke="#f48fb1" stroke-width="2.5"/>
            <!-- Spray-painted Text -->
            <text x="0" y="8" 
                  fill="${colorHex}" 
                  font-family="'Impact', 'Arial Black', sans-serif" 
                  font-size="25" 
                  font-weight="900"
                  text-anchor="middle" 
                  letter-spacing="1.5"
                  filter="url(#spray-${wordText})">
              ${wordText}
            </text>
            <!-- Bow Knot -->
            <path d="M 0,32 C -18,18 -32,38 -10,42 C -2,44 -1,33 0,32 Z" fill="#b39ddb"/>
            <path d="M 0,32 C 18,18 32,38 10,42 C 2,44 1,33 0,32 Z" fill="#b39ddb"/>
            <circle cx="0" cy="34" r="5" fill="#9575cd"/>
            <path d="M -3,37 L -12,58 L -2,56 Z" fill="#9575cd"/>
            <path d="M 3,37 L 12,58 L 2,56 Z" fill="#9575cd"/>
          </g>
        </svg>
      `;
    }

    function shuffle(array) {
      return array.slice().sort(() => Math.random() - 0.5);
    }

    function renderColorBank() {
      const container = document.getElementById('flowerPills');
      container.innerHTML = FLOWERS.map(f => `
        <div class="flower-pill">
          <div class="color-dot" style="background-color: ${f.color}"></div>
          <span>${f.name}</span>
        </div>
      `).join('');
    }

    function generateRound() {
      const input = document.getElementById('guessInput');
      input.value = '';
      input.focus();

      const shuffled = shuffle(FLOWERS);
      const missingFlower = shuffled[0];
      currentMissing = missingFlower.name;

      const remaining = shuffled.slice(1);
      const textFlowers = remaining.slice(0, 3);
      const colorFlowers = remaining.slice(3, 6);

      const bouquetStage = document.getElementById('bouquetStage');
      bouquetStage.innerHTML = '';

      for (let i = 0; i < 3; i++) {
        const card = document.createElement('div');
        card.className = 'bouquet-card';
        card.innerHTML = createBouquetSVG(textFlowers[i].name, colorFlowers[i].color);
        bouquetStage.appendChild(card);
      }

      roundStartTime = performance.now();
    }

    function handleGuess(event) {
      event.preventDefault();
      const input = document.getElementById('guessInput');
      const userGuess = input.value.trim().toUpperCase();
      const feedback = document.getElementById('feedback');

      if (!userGuess) return;

      if (userGuess === currentMissing) {
        const solveTimeMs = performance.now() - roundStartTime;
        const solveTimeSec = (solveTimeMs / 1000).toFixed(2);

        score++;
        document.getElementById('score').textContent = score;
        document.getElementById('lastTime').textContent = `${solveTimeSec}s`;

        if (bestTime === null || solveTimeMs < bestTime) {
          bestTime = solveTimeMs;
          document.getElementById('bestTime').textContent = `${solveTimeSec}s`;
        }

        feedback.className = 'feedback correct';
        feedback.innerHTML = `Correct! <span class="time-badge">⏱️ ${solveTimeSec}s</span>`;

        if (score >= 5) {
          setTimeout(() => {
            alert(`🏆 Matchup Complete! You reached 5 points!\nFastest round: ${(bestTime/1000).toFixed(2)}s`);
            score = 0;
            document.getElementById('score').textContent = score;
            feedback.innerHTML = '';
            generateRound();
          }, 300);
        } else {
          setTimeout(() => {
            feedback.innerHTML = '';
            generateRound();
          }, 800);
        }
      } else {
        feedback.className = 'feedback wrong';
        feedback.textContent = `Incorrect! (Missing was ${currentMissing})`;
        setTimeout(() => {
          feedback.textContent = '';
          generateRound();
        }, 1100);
      }
    }

    function toggleColorBank() {
      const bank = document.getElementById('colorBank');
      const btn = document.getElementById('toggleBankBtn');
      bank.classList.toggle('hidden');
      if (bank.classList.contains('hidden')) {
        btn.textContent = 'Show Color Bank';
      } else {
        btn.textContent = 'Hide Color Bank';
      }
      document.getElementById('guessInput').focus();
    }

    renderColorBank();
    generateRound();
  </script>
</body>
</html>
